<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- ── Primary SEO ── -->
  <title>Contact &amp; Book | Wolban Short Lets — Lagos Luxury Short-Let</title>
  <meta name="description" content="Book your stay or get in touch with Wolban Short Lets. Luxury serviced apartments in Ikeja, Lagos. Fast response guaranteed.">
  <meta name="keywords" content="book shortlet Lagos, contact Wolban, Ikeja apartment reservation, shortlet booking form Nigeria">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.wolbanshortlets.com/contact.html">

  <!-- ── Open Graph ── -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wolban Short Lets">
  <meta property="og:title" content="Contact &amp; Book | Wolban Short Lets">
  <meta property="og:description" content="Book your stay or ask a question. We respond within hours.">
  <meta property="og:url" content="https://www.wolbanshortlets.com/contact.html">
  <meta property="og:image" content="https://www.wolbanshortlets.com/media/slide1.jpg">

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact &amp; Book | Wolban Short Lets">
  <meta name="twitter:description" content="Book your luxury short-let in Lagos today.">
  <meta name="twitter:image" content="https://www.wolbanshortlets.com/media/slide1.jpg">

  <!-- ── Preconnects ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://docs.google.com">

  <!-- ── Fonts ── -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ── Icons ── -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- ── Bootstrap CSS ── -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- ── Site CSS ── -->
  <link rel="stylesheet" href="main.css">
  <script src="site.config.js"></script>
</head>
<body>

  <!-- Page Loader -->
  <div id="page-loader" role="status" aria-label="Loading">
    <div class="loader-wordmark">Wolban <span>Short Lets</span></div>
    <div class="loader-ring"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- ════════════════════════════════════════════
       PAGE HERO
  ═════════════════════════════════════════════ -->
  <header class="page-hero" style="margin-top:var(--navbar-h);" aria-label="Contact page hero">
    <div class="page-hero__bg" style="background-image:url('media/slide3.jpg');"></div>
    <div class="container page-hero__content">
      <span class="page-hero__tag">Get In Touch</span>
      <h1 class="page-hero__title">Book Your Stay</h1>
    </div>
  </header>

  <!-- ════════════════════════════════════════════
       CONTACT SECTION
  ═════════════════════════════════════════════ -->
  <section class="contact-wrap" aria-labelledby="contact-heading">
    <div class="container">

      <!-- Header -->
      <div class="text-center mb-5 reveal">
        <span class="badge-gold">Contact Us</span>
        <h2 class="section-title" id="contact-heading">Let's Make It Happen</h2>
        <p class="section-subtitle mt-3 mx-auto" style="max-width:580px;">
          Have a question or ready to reserve your apartment? Fill in the form and we'll get back to you within a few hours. You can also reach us directly via the details below.
        </p>
      </div>

      <div class="row g-4 align-items-start">

        <!-- Contact info column -->
        <div class="col-lg-4 reveal-l">
          <div class="contact-info-box" id="contact-info-box">
            <h3>Direct Contact</h3>
            <!-- Populated by JS from SITE_CONFIG -->
          </div>
        </div>

        <!-- Form column -->
        <div class="col-lg-8 reveal-r">
          <div class="form-outer" id="form-outer">
            <!-- iframe injected by JS from SITE_CONFIG -->
            <div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text-muted);font-size:0.9rem;">
              <span><i class="fas fa-spinner fa-spin me-2"></i>Loading booking form…</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- ── Scripts ── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="site.utils.js"></script>

  <!-- ── Inject contact info + form from SITE_CONFIG ── -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof SITE_CONFIG === 'undefined') return;

    var c  = SITE_CONFIG.contact;
    var s  = SITE_CONFIG.social;
    var em = SITE_CONFIG.embeds;

    /* Contact info box */
    var box = document.getElementById('contact-info-box');
    if (box) {
      box.innerHTML = '<h3>Direct Contact</h3>' +

        '<div class="ci-row">' +
          '<div class="ci-icon"><i class="fas fa-map-marker-alt"></i></div>' +
          '<div>' +
            '<span class="ci-label">Address</span>' +
            '<span class="ci-val">' + c.addressLine1 + ',<br>' + c.addressLine2 + '</span>' +
          '</div>' +
        '</div>' +

        '<div class="ci-row">' +
          '<div class="ci-icon"><i class="fas fa-phone"></i></div>' +
          '<div>' +
            '<span class="ci-label">Phone</span>' +
            '<span class="ci-val">' +
              '<a href="tel:' + c.phone + '">' + c.phoneDisplay + '</a>' +
            '</span>' +
          '</div>' +
        '</div>' +

        '<div class="ci-row">' +
          '<div class="ci-icon"><i class="fas fa-envelope"></i></div>' +
          '<div>' +
            '<span class="ci-label">Email</span>' +
            '<span class="ci-val"><a href="mailto:' + c.email + '">' + c.email + '</a></span>' +
          '</div>' +
        '</div>' +

        '<div class="ci-row">' +
          '<div class="ci-icon"><i class="fab fa-whatsapp"></i></div>' +
          '<div>' +
            '<span class="ci-label">WhatsApp</span>' +
            '<span class="ci-val">' +
              '<a href="https://wa.me/' + c.whatsapp.replace(/\D/g,'') + '" ' +
                 'target="_blank" rel="noopener noreferrer">Chat with us</a>' +
            '</span>' +
          '</div>' +
        '</div>' +

        '<hr style="border-color:var(--border);margin:1.4rem 0;">' +

        '<p style="font-size:0.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;">Follow Us</p>' +
        '<div class="social-row">' +
          '<a href="' + s.facebook + '" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook">' +
            '<i class="fab fa-facebook-f"></i></a>' +
          '<a href="' + s.instagram + '" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">' +
            '<i class="fab fa-instagram"></i></a>' +
        '</div>';
    }

    /* Booking form iframe */
    var formWrap = document.getElementById('form-outer');
    if (formWrap) {
      if (em && em.contactForm) {
        formWrap.innerHTML =
          '<iframe src="' + em.contactForm + '" ' +
            'title="Wolban Short Lets Booking Form" ' +
            'aria-label="Booking enquiry form" ' +
            'loading="lazy" ' +
            'scrolling="yes">' +
            'Loading…' +
          '</iframe>';
      } else {
        /* Fallback when form is missing */
        var wa = c.whatsapp.replace(/\D/g, '');
        formWrap.innerHTML =
          '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);">' +
            '<i class="fas fa-envelope-open-text fa-2x mb-3" style="opacity:0.5"></i>' +
            '<p class="mb-3">Online booking is currently unavailable.<br>Please contact us directly via Phone or WhatsApp.</p>' +
            '<a href="https://wa.me/' + wa + '" class="btn-gold" target="_blank" rel="noopener"><i class="fab fa-whatsapp me-2"></i>Chat on WhatsApp</a>' +
          '</div>';
      }
    }
  });
  </script>

</body>
</html>
